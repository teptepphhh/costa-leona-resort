<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Costa Leona AWS infrastructure design">
  <title>Costa Leona Resort - AWS infrastructure design</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E6168"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6b00"/></marker>
  </defs>
  <rect width="1240" height="700" fill="#fffdf7"/>
  <!-- region -->
  <rect x="330" y="20" width="700" height="660" rx="14" fill="#f2fafa" stroke="#0E6168" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="348" y="46" font-size="15" font-weight="700" fill="#0E6168">AWS Region ap-southeast-1 (Singapore) - one region, one account</text>

  <!-- guest -->
  <rect x="20" y="300" width="130" height="80" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="85" y="333" font-size="15" font-weight="700" text-anchor="middle">Guest</text>
  <text x="85" y="354" font-size="12" text-anchor="middle">web browser</text>
  <!-- cloudfront -->
  <rect x="180" y="290" width="130" height="100" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="245" y="320" font-size="14" font-weight="700" text-anchor="middle">CloudFront</text>
  <text x="245" y="340" font-size="12" text-anchor="middle">free HTTPS URL</text>
  <text x="245" y="357" font-size="11" text-anchor="middle">d3s6rxkesmrq3z</text>
  <text x="245" y="373" font-size="11" text-anchor="middle">.cloudfront.net</text>

  <!-- EC2 -->
  <rect x="360" y="70" width="440" height="330" rx="12" fill="#fff" stroke="#0E6168" stroke-width="2.5"/>
  <text x="378" y="96" font-size="15" font-weight="700" fill="#0E6168">EC2 t3.small (costaleona-web)</text>
  <text x="378" y="114" font-size="11.5" fill="#444">Security group: TCP 80 only from CloudFront prefix list (no SSH) - 20 GB encrypted gp3 - IMDSv2</text>
  <rect x="380" y="135" width="170" height="70" rx="8" fill="#e6f4f4" stroke="#0E6168"/>
  <text x="465" y="162" font-size="13.5" font-weight="700" text-anchor="middle">LibreChat</text>
  <text x="465" y="181" font-size="11.5" text-anchor="middle">reskinned UI (Docker)</text>
  <text x="465" y="196" font-size="11" text-anchor="middle">login, chat history</text>
  <rect x="610" y="135" width="170" height="70" rx="8" fill="#fdf1d6" stroke="#9a6b00"/>
  <text x="695" y="162" font-size="13.5" font-weight="700" text-anchor="middle">Leona gateway</text>
  <text x="695" y="181" font-size="11.5" text-anchor="middle">FastAPI (Docker)</text>
  <text x="695" y="196" font-size="11" text-anchor="middle">prompt, request log, metrics</text>
  <rect x="380" y="240" width="170" height="70" rx="8" fill="#e6f4f4" stroke="#0E6168"/>
  <text x="465" y="267" font-size="13.5" font-weight="700" text-anchor="middle">MongoDB</text>
  <text x="465" y="286" font-size="11.5" text-anchor="middle">Docker volume, not published</text>
  <text x="465" y="301" font-size="11" text-anchor="middle">users + chat history</text>
  <rect x="610" y="240" width="170" height="70" rx="8" fill="#e6f4f4" stroke="#0E6168"/>
  <text x="695" y="267" font-size="13.5" font-weight="700" text-anchor="middle">CloudWatch agent</text>
  <text x="695" y="286" font-size="11.5" text-anchor="middle">disk + memory metrics</text>
  <text x="695" y="301" font-size="11" text-anchor="middle">ships request log</text>
  <text x="378" y="335" font-size="11.5" fill="#444">Scripts on the instance (from Git): backup.sh, smoketest.sh, restore_test.sh</text>
  <text x="378" y="352" font-size="11.5" fill="#444">logrotate (hourly) on requests.log - added after the disk-full incident</text>
  <text x="378" y="369" font-size="11.5" fill="#444">Instance role: read S3 + SSM params, put metrics, publish SNS</text>
  <text x="378" y="386" font-size="11.5" fill="#444">Tagged Project=SAM10, Role=web</text>

  <!-- AWS services row -->
  <rect x="350" y="440" width="150" height="95" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="425" y="466" font-size="13.5" font-weight="700" text-anchor="middle">S3 content bucket</text>
  <text x="425" y="485" font-size="11" text-anchor="middle">knowledge/ (six docs)</text>
  <text x="425" y="500" font-size="11" text-anchor="middle">backups/mongo/ (14 d)</text>
  <text x="425" y="515" font-size="11" text-anchor="middle">versioning + encryption</text>
  <rect x="520" y="440" width="150" height="95" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="595" y="466" font-size="13.5" font-weight="700" text-anchor="middle">SSM Parameter</text>
  <text x="595" y="483" font-size="13.5" font-weight="700" text-anchor="middle">Store</text>
  <text x="595" y="503" font-size="11" text-anchor="middle">SecureString: model key,</text>
  <text x="595" y="518" font-size="11" text-anchor="middle">app secrets, gateway token</text>
  <rect x="690" y="440" width="160" height="95" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="770" y="466" font-size="13.5" font-weight="700" text-anchor="middle">CloudWatch</text>
  <text x="770" y="485" font-size="11" text-anchor="middle">dashboard, 8 alarms,</text>
  <text x="770" y="500" font-size="11" text-anchor="middle">5 log groups (14 d),</text>
  <text x="770" y="515" font-size="11" text-anchor="middle">custom metrics</text>
  <rect x="870" y="440" width="140" height="95" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="940" y="466" font-size="13.5" font-weight="700" text-anchor="middle">SNS</text>
  <text x="940" y="485" font-size="11" text-anchor="middle">costaleona-alerts</text>
  <text x="940" y="500" font-size="11" text-anchor="middle">email subscription</text>
  <rect x="350" y="565" width="170" height="85" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="435" y="591" font-size="13.5" font-weight="700" text-anchor="middle">EventBridge</text>
  <text x="435" y="610" font-size="11" text-anchor="middle">2 hourly rules -&gt; SSM</text>
  <text x="435" y="625" font-size="11" text-anchor="middle">Run Command (backup,</text>
  <text x="435" y="640" font-size="11" text-anchor="middle">smoke test)</text>
  <rect x="540" y="565" width="150" height="85" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="615" y="591" font-size="13.5" font-weight="700" text-anchor="middle">CloudTrail</text>
  <text x="615" y="610" font-size="11" text-anchor="middle">who did what, this region</text>
  <text x="615" y="625" font-size="11" text-anchor="middle">-&gt; private S3 trail bucket</text>
  <rect x="710" y="565" width="150" height="85" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="785" y="591" font-size="13.5" font-weight="700" text-anchor="middle">IAM</text>
  <text x="785" y="610" font-size="11" text-anchor="middle">user + MFA, admin only via</text>
  <text x="785" y="625" font-size="11" text-anchor="middle">SAM10-AdminRole, no keys</text>
  <rect x="880" y="565" width="130" height="85" rx="10" fill="#fff" stroke="#0E6168" stroke-width="2"/>
  <text x="945" y="591" font-size="13.5" font-weight="700" text-anchor="middle">AWS Budgets</text>
  <text x="945" y="610" font-size="11" text-anchor="middle">zero-spend alert</text>
  <text x="945" y="625" font-size="11" text-anchor="middle">tags: Project=SAM10</text>

  <!-- outside: gemini + email -->
  <rect x="1060" y="130" width="160" height="90" rx="10" fill="#fdf1d6" stroke="#9a6b00" stroke-width="2"/>
  <text x="1140" y="160" font-size="13.5" font-weight="700" text-anchor="middle">Google Gemini API</text>
  <text x="1140" y="180" font-size="11.5" text-anchor="middle">outside AWS, free tier</text>
  <text x="1140" y="196" font-size="11" text-anchor="middle">invented data only</text>
  <rect x="1060" y="450" width="160" height="75" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="1140" y="482" font-size="13.5" font-weight="700" text-anchor="middle">Operator e-mail</text>
  <text x="1140" y="502" font-size="11.5" text-anchor="middle">alarm + OK messages</text>

  <!-- flows -->
  <path d="M150 340 H178" stroke="#0E6168" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M310 340 H358" stroke="#0E6168" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M358 290 H320 V250 H310" stroke="none" fill="none"/>
  <path d="M550 170 H608" stroke="#0E6168" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M780 170 H1058" stroke="#9a6b00" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
  <path d="M465 205 V238" stroke="#0E6168" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M640 205 V225 H595 V438" stroke="#0E6168" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M665 205 L455 438" stroke="#0E6168" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M745 310 V438" stroke="#0E6168" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M850 487 H868" stroke="#0E6168" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M1010 487 H1058" stroke="#0E6168" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M435 563 V537" stroke="#0E6168" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- step numbers -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="164" cy="326" r="11" fill="#0E6168"/><text x="164" y="331">1</text>
    <circle cx="334" cy="326" r="11" fill="#0E6168"/><text x="334" y="331">2</text>
    <circle cx="579" cy="156" r="11" fill="#0E6168"/><text x="579" y="161">3</text>
    <circle cx="520" cy="360" r="11" fill="#0E6168" opacity="0"/>
    <circle cx="560" cy="300" r="11" fill="#9a6b00"/><text x="560" y="305">4</text>
    <circle cx="920" cy="156" r="11" fill="#9a6b00"/><text x="920" y="161">5</text>
    <circle cx="745" cy="375" r="11" fill="#0E6168"/><text x="745" y="380">7</text>
    <circle cx="858" cy="474" r="11" fill="#0E6168"/><text x="858" y="479">8</text>
  </g>
  <text x="920" y="188" font-size="11" fill="#9a6b00" text-anchor="middle">answer returns (6)</text>

  <!-- legend -->
  <text x="20" y="440" font-size="13" font-weight="700">How a question travels</text>
  <g font-size="11.5" fill="#222">
    <text x="20" y="460">1  Guest asks Leona over HTTPS (CloudFront)</text>
    <text x="20" y="478">2  CloudFront forwards to the EC2 origin, port 80</text>
    <text x="20" y="496">3  LibreChat posts the chat to the Leona gateway</text>
    <text x="20" y="514">4  Gateway reads the model key (SSM) and the</text>
    <text x="36" y="530">knowledge base (S3), builds the prompt</text>
    <text x="20" y="548">5  Gateway calls the Gemini API (outside AWS)</text>
    <text x="20" y="566">6  Answer streams back to LibreChat and the guest</text>
    <text x="20" y="584">7  Gateway logs the request (question, time,</text>
    <text x="36" y="600">success, version) and sends metrics to CloudWatch</text>
    <text x="20" y="618">8  Alarms notify SNS, which e-mails the operator</text>
  </g>
  <text x="20" y="660" font-size="11" fill="#555">Dashed lines: runtime reads of secrets (SSM) and content (S3).</text>
  <text x="20" y="678" font-size="11" fill="#555">Backups: EventBridge -&gt; SSM Run Command -&gt; backup.sh -&gt; S3.</text>
</svg>
